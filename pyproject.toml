[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code2req"
version = "0.1.0"
description = "Recover natural-language requirements from a codebase, grounded in code evidence"
requires-python = ">=3.12"
license = {text = "MIT"}
# Slim subset of vendor/codewiki's dependencies: only what its dependency
# analyzer and module clustering import. CodeWiki itself is vendored, not installed.
dependencies = [
    "tree-sitter>=0.23.2",
    "tree-sitter-language-pack>=0.8.0,<0.9.0",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.21.4",
    "tree-sitter-typescript>=0.21.2",
    "tree-sitter-c>=0.21.4",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-scala>=0.23.2,<0.24.0",
    "tree-sitter-rust>=0.23.2,<0.24.0",
    "litellm>=1.77.0",
    "openai>=1.107.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pydantic-ai-slim>=1.0.6",
    "tiktoken",
    "python-dotenv>=1.1.1",
    "pathspec>=0.12.1",
    "rich>=14.1.0",
    "networkx>=3.5",
    "colorama>=0.4.6",
    "PyYAML>=6.0.2",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "typst>=0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "httpx"]

[project.scripts]
code2req = "code2req.cli:main"

[tool.setuptools.packages.find]
include = ["code2req*"]

[tool.setuptools.package-data]
"code2req.web" = ["static/*"]
"code2req" = ["report/*.typ", "report/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
